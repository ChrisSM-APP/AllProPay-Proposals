<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Referrer probe</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; margin: 0; padding: 32px 20px; background: #f6f7f9; color: #1a1f2b; }
  .card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .verdict { font-size: 26px; font-weight: 700; padding: 16px; border-radius: 8px; margin: 16px 0; }
  .yes { background: #e3f6e8; color: #136b2e; }
  .no { background: #fdeaea; color: #9b1c1c; }
  code { background: #eef0f4; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>Referrer probe (internal test, not a proposal)</h1>
  <div id="verdict" class="verdict"></div>
  <p>Came from: <code id="ref"></code></p>
  <p>Screenshot this and send it back.</p>
</div>
<script>
var r = document.referrer || "";
document.getElementById("ref").textContent = r || "(nothing - the source was hidden)";
var v = document.getElementById("verdict");
if (/zoho/i.test(r)) { v.textContent = "YES - Zoho shows where the click came from"; v.className = "verdict yes"; }
else { v.textContent = "NO - Zoho hid it"; v.className = "verdict no"; }
</script>
</body>
</html>

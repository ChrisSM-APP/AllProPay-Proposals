name: Deploy proposals site to GitHub Pages

# Replaces GitHub's deprecated "legacy" Pages builder, which hung on every
# build from 2026-08-05 16:40 UTC onward and silently froze the live site
# (new proposals 404'd, rebuilt proposals kept serving their old version).
# This publishes the repo as-is: no Jekyll, no processing, just an upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # self-heal: push an empty commit to main
  actions: write    # self-heal: start the redeploy run
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so a rep's link
# is never briefly missing because a second proposal was published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # A healthy deploy takes well under a minute. 3 minutes means "stuck".
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000

      # Self-heal (2026-11-10). Pages uses the commit SHA as the deployment ID.
      # When GitHub hangs on a deploy it cancels that deployment, and every retry
      # of the SAME commit (re-run or workflow_dispatch) polls the dead one and
      # times out. A new empty commit gets a new ID and deploys normally.
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this also
      # dispatches the redeploy. Capped at 2 automatic retries in a row.
      # The run still fails (one email), so a hang is never silent.
      - name: Self-heal a stuck deploy
        if: failure() && steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to ${head:0:7}; that push's own run deploys it."
            exit 0
          fi
          streak=$(gh api "repos/$REPO/commits?sha=main&per_page=2" \
            --jq '[.[] | select(.commit.message | startswith("Redeploy (auto)"))] | length')
          if [ "$streak" -ge 2 ]; then
            echo "::error::Pages deploy failed after 2 automatic retries. Needs a person."
            exit 1
          fi
          tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
          new=$(gh api "repos/$REPO/git/commits" \
            -f message="Redeploy (auto): Pages deploy of ${head:0:7} got stuck" \
            -f tree="$tree" -f "parents[]=$head" --jq .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$new" > /dev/null
          gh workflow run pages.yml --repo "$REPO" --ref main
          echo "::warning::Deploy of ${head:0:7} got stuck. Pushed ${new:0:7} and started a fresh deploy."

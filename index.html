<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AllProPay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #1a1d27;
      border: 1px solid #2a2f3d;
      border-radius: 12px;
      padding: 48px 40px;
      text-align: center;
    }
    .brand {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .brand .pro { color: #3b82f6; }
    .tagline {
      font-size: 13px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      color: #c7cbd6;
      margin-bottom: 16px;
    }
    a {
      color: #3b82f6;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #2a2f3d;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">All<span class="pro">Pro</span>Pay</div>
    <div class="tagline">Smarter Payments. Better Margins.</div>
    <h1>Looking for your proposal?</h1>
    <p>Your AllProPay rep should have sent you a direct link. Proposal pages aren't listed publicly.</p>
    <p>If you can't find your link, reach out to your rep or email <a href="mailto:hello@allpropay.com">hello@allpropay.com</a>.</p>
    <div class="footer">
      AllProPay &middot; B2B Payment Processing &middot; US &amp; Canada
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AllProPay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1120;
      color: #F5F7FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #131a2c;
      border: 1px solid #1f2940;
      border-radius: 16px;
      padding: 56px 48px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .logo-wrap {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 10px 16px;
      display: inline-block;
      margin-bottom: 36px;
    }
    .logo-img {
      display: block;
      width: 300px;
      height: auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #c7cbd6;
      margin-bottom: 18px;
    }
    a {
      color: #00D4FF;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { color: #0066FF; text-decoration: underline; }
    .footer {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid #1f2940;
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    /* === AllProPay mobile responsive v3 (portal) === screen-only */
    @media screen and (max-width: 640px) {
      body { padding: 16px; }
      .card { padding: 34px 22px; }
      .logo-wrap { padding: 8px 12px; max-width: 100%; }
      .logo-img { width: 100%; max-width: 240px; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/AllProPay_Logo.jpg" alt="AllProPay" class="logo-img">
    </div>
    <h1>Looking for your proposal?</h1>
    <p>Your AllProPay rep should have sent you a direct link. Proposal pages aren't listed publicly.</p>
    <p>If you can't find your link, reach out to your rep or email <a href="mailto:support@allpropay.com">support@allpropay.com</a>.</p>
    <div class="footer">
      Accept Payments Anywhere
    </div>
  </div>
</body>
</html>

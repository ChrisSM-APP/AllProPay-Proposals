<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ZZ_TEST XX_Test - Rep Link Check</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; margin: 0; padding: 32px 20px; background: #f6f7f9; color: #1a1f2b; }
  .card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .state { font-size: 22px; font-weight: 700; padding: 16px; border-radius: 8px; margin: 16px 0; }
  .rep { background: #e3f6e8; color: #136b2e; }
  .merchant { background: #fff4dc; color: #7a4b00; }
</style>
</head>
<body>
<div class="card">
  <h1>ZZ_TEST XX_Test - Rep Link Check</h1>
  <p>Internal test page, not a real proposal. It runs the same open tracker as every live proposal.</p>
  <div id="state" class="state"></div>
</div>
<script>
/* Same open beacon as every live proposal (copied from the build template 2026-10-27). */
(function(){try{var b="https://beacon.allpropay.com/v";var q=new URLSearchParams(location.search);
if(q.get("rep")){localStorage.setItem("app_rep","1");}
if(!b||location.protocol!=="https:"||localStorage.getItem("app_rep")==="1")return;
var m=location.pathname.match(/^\/([a-z0-9][a-z0-9-]+)\/?/);if(!m)return;
function ping(u){if(navigator.sendBeacon){navigator.sendBeacon(u);}else{fetch(u,{mode:"no-cors",keepalive:true}).catch(function(){});}}
ping(b+"?p="+encodeURIComponent(m[1]));
}catch(e){}})();
</script>
<script>
var s = document.getElementById("state"), rep = false;
try { rep = localStorage.getItem("app_rep") === "1"; } catch (e) {}
if (rep) { s.textContent = "This browser is marked as a rep's. This open was NOT counted, no ping."; s.className = "state rep"; }
else { s.textContent = "This browser looks like a merchant's. This open was counted, a ping is on its way."; s.className = "state merchant"; }
</script>
</body>
</html>
